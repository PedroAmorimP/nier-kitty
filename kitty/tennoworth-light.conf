# Tennoworth light mode for Kitty: paper, ink, and distinct annotation inks.
# Source palette: Tennoworth's YoRHa light tokens (paper, ink, and chrome).

# A terminal reads like one of Tennoworth's light paper panels. The slightly
# darker page paper frames tabs and keeps the window from looking flat.
background #dbd7bf
foreground #2f2b20

# Selected text and the cursor use Tennoworth's single inverted ink surface.
selection_background #4b4739
selection_foreground #dbd7bf
cursor #4b4739
cursor_text_color #dbd7bf
url_color #252385

# The six inks are chosen together for separation on the khaki paper: each
# has at least 6:1 contrast, and hue, lightness, and saturation all differ.
# On this paper, "yellow" can only be a readable burnt-orange ink.
# Black is raised paper so black-on-color badges (ls, test runners) stay
# readable; plain black text is rare on light terminals and is the trade-off.
color0 #f2efe0
color1 #97082b
color2 #00550d
color3 #663000
color4 #252385
color5 #61355b
color6 #024b56
color7 #46422f

# On a light background, "bright" means stronger/darker ink rather than more
# luminance. Bright black remains readable for comments and secondary output.
color8 #5f5a47
color9 #76011f
color10 #014309
color11 #512500
color12 #1c1276
color13 #51264b
color14 #023b44
color15 #1f1c14

# Faint text stays readable; colors 16-255 derive from this palette instead of
# xterm's dark-background grays (Kitty 0.47+).
dim_opacity 0.75
palette_generate semantic

# Kitty marks use the annotation inks.
mark1_foreground #dbd7bf
mark1_background #024b56
mark2_foreground #dbd7bf
mark2_background #663000
mark3_foreground #dbd7bf
mark3_background #61355b

# Mirror Tennoworth's paper hierarchy: page, raised paper, and one ink bar.
tab_bar_style separator
tab_separator " │ "
tab_bar_background #cbc6ac
active_tab_background #4b4739
active_tab_foreground #dbd7bf
active_tab_font_style bold
inactive_tab_background #cfcbb2
inactive_tab_foreground #57523f
inactive_tab_font_style normal

active_border_color #2f2b20
inactive_border_color #b5b097
bell_border_color #97082b

tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
window_border_width 1
