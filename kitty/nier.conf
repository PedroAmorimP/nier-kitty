# NieR-inspired colors and terminal chrome. See README.md for credits.
# Parchment text keeps yellow output (hashes, warnings, strings) distinct;
# amber remains the accent for the cursor, selection, tabs, and borders.
background #14110d
foreground #d6c6a2

# Amber selection and cursor, with dark text for contrast.
selection_background #c08e3a
selection_foreground #14110d
cursor #e8b968
cursor_text_color #14110d
url_color #9ed4c4

# Preserve semantic ANSI hues for errors, success, diffs, and syntax.
# Red and magenta reach 4.5:1 so compiler errors and warnings stay legible.
color0 #1c1814
color1 #ce5d44
color2 #8a9c4a
color3 #d8963e
color4 #6a8aa0
color5 #a87395
color6 #82b4a8
color7 #d6c6a2
# Brighter than the Konsole palette's dark gray: readable CLI comments.
color8 #948061
color9 #e06c4e
color10 #a4b85a
color11 #eeae52
color12 #82a4bc
color13 #be86a8
color14 #9ed4c4
color15 #f2e4bc

# Faint text (hints, timings) stays readable; colors 16-255 follow the theme
# instead of xterm's neutral grays (Kitty 0.47+).
dim_opacity 0.6
palette_generate semantic

# Kitty marks use the theme's accents.
mark1_foreground #14110d
mark1_background #82b4a8
mark2_foreground #14110d
mark2_background #d4a558
mark3_foreground #14110d
mark3_background #be86a8

# Flat, compact interface inspired by the game's menu selection bars.
tab_bar_style separator
tab_separator " │ "
tab_bar_background #14110d
active_tab_background #d4a558
active_tab_foreground #14110d
active_tab_font_style bold
inactive_tab_background #252017
inactive_tab_foreground #d4b576
inactive_tab_font_style normal

# Amber identifies keyboard focus; subdued borders separate other panes.
active_border_color #d4a558
inactive_border_color #3a3226
bell_border_color #e06c4e

# Compact numbered tabs and visible pane boundaries.
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"
window_border_width 1
